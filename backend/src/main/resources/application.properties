spring.application.name=mini-ats
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_ats?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=method

cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}

logging.level.com.ats=INFO

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-before-going-live-0123456789}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@miniats.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
